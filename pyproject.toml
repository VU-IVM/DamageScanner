[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "damagescanner"
version = "1.0.1"
authors = [
    {name = "Elco Koks", email = "elco.koks@vu.nl"},
    {name = "Jens de Bruijn", email = "jens.de.bruijn@vu.nl"},
]
license = "MIT"
license-files = ["LICENSE"]
description = "Direct damage assessments for natural hazards"
keywords = ["GIS", "natural hazards", "damage assessment", "remote sensing", "raster", "vector", "geospatial"]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "exactextract >=0.3.0",
    "geopandas >=1.0.0",
    "matplotlib >=3.10.0",
    "numpy >=2.3.0",
    "openpyxl >=2.0.0",
    "pyproj >=3.7.2",
    "rasterio >=1.5.0",
    "rioxarray >=0.20",
    "tqdm >=4.67.0",
    "xarray >=2025.0.0",
    "xlrd >=2.0.0"
]

[dependency-groups]
dev = [
    {include-group = "tests"},
    "ruff >=0.11.2",
    "ty >=0.0.17"
]
docs = [
    "markdown-include >=0.8.1",
    "mike >=2.1.3",
    "mkdocs >=1.6.1",
    "mkdocs-include-markdown-plugin >=7.2.1",
    "mkdocs-jupyter >=0.25.0",
    "mkdocs-material >=9.7.2",
    "mkdocstrings[python] >=1.0.3",
]
tests = ["pytest >=9.0.0", "pyarrow >=22.0.0", "netcdf4 >=1.7.4"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
"Homepage" = "https://github.com/VU-IVM/DamageScanner"
"Documentation" = "https://vu-ivm.github.io/DamageScanner/"

